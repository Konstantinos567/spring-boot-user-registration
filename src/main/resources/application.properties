spring.application.name=user-registration
# ===== Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/user_registration
spring.datasource.username=${DB_USERNAME:springstudent}
spring.datasource.password=${DB_PASSWORD:springstudent}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false